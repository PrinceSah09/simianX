apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scalekart-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: scalekart
    app.kubernetes.io/part-of: scalekart-gitops
    environment: prod
spec:
  project: default
  source:
    repoURL: https://github.com/PrinceSah09/Scalekart.git
    targetRevision: HEAD
    path: helm/scalekart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: scalekart-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
