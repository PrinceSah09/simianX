apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simianx-root-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: simianx-root
    app.kubernetes.io/part-of: simianx-gitops
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/PrinceSah09/Scalekart.git
    targetRevision: HEAD
    path: argocd/apps/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

