apiVersion: v1
kind: Service
metadata:
  name: scalekart-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: scalekart-backend
    {{- include "scalekart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: scalekart-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      {{- if and (eq .Values.backend.service.type "NodePort") .Values.backend.service.nodePort }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: simianx-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: simianx-backend
    {{- include "scalekart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: scalekart-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
