apiVersion: v1
kind: Service
metadata:
  name: scalekart-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: scalekart-backend
    {{- include "scalekart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: scalekart-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      protocol: TCP
