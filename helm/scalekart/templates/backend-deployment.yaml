apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalekart-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: scalekart-backend
    app: scalekart-backend
    {{- include "scalekart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: scalekart-backend
  template:
    metadata:
      labels:
        app: scalekart-backend
        app.kubernetes.io/name: scalekart-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.backend.service.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: scalekart-backend
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
              name: http
          env:
            - name: ENV
              value: {{ .Values.backend.env.environment | quote }}
            - name: PORT
              value: {{ .Values.backend.env.port | quote }}
            - name: TARGET_SERVICE_URL
              value: {{ .Values.backend.env.targetServiceUrl | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.backend.env.prometheusUrl | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 4
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
