apiVersion: v1
kind: ServiceAccount
metadata:
  name: scalekart-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: scalekart-backend
    {{- include "scalekart.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scalekart-backend-viewer
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: scalekart-backend
    {{- include "scalekart.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scalekart-backend-viewer-binding
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: scalekart-backend
    {{- include "scalekart.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: scalekart-backend
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: scalekart-backend-viewer
  apiGroup: rbac.authorization.k8s.io
