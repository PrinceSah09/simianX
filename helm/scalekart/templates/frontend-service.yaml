{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: scalekart-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: scalekart-frontend
    {{- include "scalekart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: scalekart-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: 80
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
      protocol: TCP
{{- end }}

