{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalekart-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: scalekart-frontend
    app: scalekart-frontend
    {{- include "scalekart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: scalekart-frontend
  template:
    metadata:
      labels:
        app: scalekart-frontend
        app.kubernetes.io/name: scalekart-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}

